name: Build

env:
  GCLOUD_PROJECT: joshlong
  GH_PAT: ${{ secrets.JOSHLONG_GITHUB_PERSONAL_ACCESS_TOKEN }}

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and publish the container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCLOUD_SA_KEY }}

      - name: Authenticate to Artifact Registry
        run: |
          gcloud config set project $GCLOUD_PROJECT
          gcloud --quiet auth configure-docker us-docker.pkg.dev

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Publish container
        env:
          IMAGE_NAME: us-docker.pkg.dev/${{ env.GCLOUD_PROJECT }}/developer-advocacy-artifact-registry/joshlong-api:latest
          PUBLISH: "true"
        run: ROOT_DIR=$GITHUB_WORKSPACE .github/workflows/build-container.sh

      - name: Invoke pipeline
        run: |
          curl --fail-with-body --silent --show-error -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_PAT}" --request POST --data '{"event_type": "update-event"}' \
            https://api.github.com/repos/developer-advocacy/joshlong-pipeline/dispatches
          echo "invoked the pipeline to deploy everything."
